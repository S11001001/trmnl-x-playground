name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript-and-format:
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Prettier check
        run: npm run format:check

      - name: Wrangler check
        run: |
          for c in */wrangler.toml; do
            npx wrangler types --check "${c%/wrangler.toml}/worker-configuration.d.ts" --config "$c"
          done
